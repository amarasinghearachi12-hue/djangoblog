
{% extends "blog/base.html" %}

{% block title %}Reset Your Password{% endblock %}

{% block content %}

<div style="
    max-width: 500px;
    margin: 50px auto;
    padding: 35px;
    background: white;
    border-radius: 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
">

    <h1 style="margin-top: 0; color: #111827;">
        Reset Your Password
    </h1>

    <p style="color: #6b7280; line-height: 1.6;">
        Forgot your password? Enter your email address below.
        We will generate a password reset link for your account.
    </p>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button
            type="submit"
            style="
                width: 100%;
                padding: 12px;
                border: none;
                border-radius: 8px;
                background: #2563eb;
                color: white;
                font-size: 16px;
                font-weight: 600;
                cursor: pointer;
            "
        >
            Send Reset Link
        </button>
    </form>

    <p style="margin-top: 20px; text-align: center;">
        <a href="{% url 'login' %}" style="color: #2563eb;">
            Back to Login
        </a>
    </p>

</div>

{% endblock %}
