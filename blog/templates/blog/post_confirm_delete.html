{% extends "blog/base.html" %}

{% block title %}
Delete Post - DjangoBlog
{% endblock %}


{% block content %}

<div class="container">

    <div
        class="card"
        style="
            max-width: 650px;
            margin: 60px auto;
            text-align: center;
        "
    >

        <div
            style="
                font-size: 4rem;
                margin-bottom: 15px;
            "
        >
            ⚠️
        </div>


        <h1
            style="
                margin-bottom: 15px;
                color: #111827;
            "
        >
            Delete Post?
        </h1>


        <p
            style="
                color: #6b7280;
                font-size: 1.05rem;
                line-height: 1.7;
            "
        >
            Are you sure you want to delete
            <strong>{{ object.title }}</strong>?
        </p>


        <p
            style="
                color: #9ca3af;
                margin-bottom: 30px;
            "
        >
            This action cannot be undone.
        </p>


        <form
            method="post"
            style="
                display: flex;
                justify-content: center;
                gap: 12px;
                flex-wrap: wrap;
            "
        >

            {% csrf_token %}

            <button
                type="submit"
                style="
                    padding: 10px 20px;
                    border: none;
                    border-radius: 8px;
                    background: #dc2626;
                    color: white;
                    font-weight: 700;
                    cursor: pointer;
                "
            >
                Yes, Delete
            </button>


            <a
                href="{% url 'blog:post_detail' object.slug %}"
                class="btn btn-outline-light"
                style="
                    background: #111827;
                "
            >
                Cancel
            </a>

        </form>

    </div>

</div>

{% endblock %}
