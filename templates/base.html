{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}DjangoBlog{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        a {
            text-decoration: none;
        }

        .navbar {
            background: linear-gradient(135deg, #111827, #1f2937);
            padding: 16px 0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
        }

        .navbar-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .navbar-brand {
            color: white;
            font-size: 1.35rem;
            font-weight: 800;
        }

        .navbar-brand:hover {
            color: #93c5fd;
        }

        .navbar-buttons {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn {
            display: inline-block;
            padding: 9px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            transition: 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn-outline-light {
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.5);
            background: transparent;
        }

        .btn-outline-light:hover {
            background: white;
            color: #111827;
        }

        .btn-primary {
            color: white;
            background: #2563eb;
            border: 1px solid #2563eb;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        main {
            min-height: calc(100vh - 150px);
        }

        footer {
            margin-top: 60px;
            background: #111827;
            color: #9ca3af;
        }

        .footer-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 35px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .footer-title {
            color: white;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .footer-text {
            margin: 0;
            font-size: 0.9rem;
        }

        .footer-links {
            display: flex;
            gap: 18px;
        }

        .footer-links a {
            color: #9ca3af;
        }

        .footer-links a:hover {
            color: white;
        }

        @media (max-width: 768px) {
            .navbar-container {
                flex-direction: column;
                align-items: stretch;
            }

            .navbar-brand {
                text-align: center;
            }

            .navbar-buttons {
                justify-content: center;
            }

            .footer-container {
                flex-direction: column;
                text-align: center;
            }
        }

        @media (max-width: 480px) {
            .navbar-buttons {
                flex-direction: column;
            }

            .navbar-buttons .btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>

<body>

<nav class="navbar">
    <div class="navbar-container">

        <a class="navbar-brand" href="{% url 'blog:home' %}">
            笨ｨ DjangoBlog
        </a>

        <div class="navbar-buttons">

            <a class="btn btn-outline-light" href="{% url 'blog:home' %}">
                Home
            </a>

            <a class="btn btn-primary" href="{% url 'blog:post_create' %}">
                + New Post
            </a>

        </div>
    </div>
</nav>

<main>
    {% block content %}
    {% endblock %}
</main>

<footer>
    <div class="footer-container">

        <div>
            <div class="footer-title">
                笨ｨ DjangoBlog
            </div>

            <p class="footer-text">
                Simple blog built with Django & PostgreSQL.
            </p>
        </div>

        <div class="footer-links">

            <a href="{% url 'blog:home' %}">
                Home
            </a>

            <a href="{% url 'blog:about' %}">
                About
            </a>

            <a href="{% url 'blog:contact' %}">
                Contact
            </a>

        </div>
    </div>
</footer>

</body>
</html>
